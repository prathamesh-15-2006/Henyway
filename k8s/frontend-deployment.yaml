apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: ecom-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: YOUR_DOCKERHUB/frontend:latest

          ports:
            - containerPort: 80